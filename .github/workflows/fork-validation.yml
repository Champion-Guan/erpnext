name: Fork Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  js-tests:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run JavaScript unit tests
        run: node --test "erpnext/tests/js/**/*.test.mjs"
